<!doctype html><meta charset="utf-8"><title>Private flight runtime contract</title><section id="garden"><button data-garden-household="omochi"><span class="garden-bird-sprite">TEST</span><span>おもち</span></button><button data-garden-household="other"><span class="garden-bird-sprite">OTHER</span></button><input value="途中"></section><script type="module">
import {mountGardenFlight} from '/src/omochi-motion-runtime.js';import {planMotion} from '/src/omochi-motion-plan.js';
const root=document.querySelector('#garden');window.enabled=true;window.frames=[];
window.dispose=mountGardenFlight({root,birdId:'omochi',plan:planMotion({from:{x:100,y:300},to:{x:300,y:300},mode:'flight',duration:3000,lift:80,bounds:{left:0,right:600,top:0,bottom:500}}),enabled:()=>window.enabled,renderFrame:(sprite,frame)=>{sprite.dataset.frame=frame;window.frames.push(frame)}});window.ready=true;
</script>
