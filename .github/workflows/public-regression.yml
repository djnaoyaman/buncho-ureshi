name: Public regression (nonblocking trial)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome
      - name: Provide native CI audio output device
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio sink_properties=device.description=CI_Audio
          pactl set-default-sink ci_audio
          pactl info
      - run: npm run test:browser
        env:
          PUBLIC_URL: https://djnaoyaman.github.io/buncho-ureshi/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
