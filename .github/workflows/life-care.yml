name: Lifecycle and memorial care
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/life-care.test.js tests/life-care-ui.test.js
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.life-care.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: life-care-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: life-care-screenshots-${{ github.sha }}
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 14
