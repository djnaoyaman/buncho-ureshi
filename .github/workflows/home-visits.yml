name: Home visitors and family roles
on:
  pull_request:
    paths:
      - 'src/engine.js'
      - 'src/encounters.js'
      - 'src/encounter-ui.*'
      - 'src/game.*'
      - 'src/care-schedule.js'
      - 'src/field-visuals.js'
      - 'tests/browser/home-visits.spec.js'
      - 'playwright.home-visits.config.js'
      - '.github/workflows/home-visits.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.home-visits.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-visits-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
