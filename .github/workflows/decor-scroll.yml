name: Decoration panel scroll reachability
on:
  pull_request:
    paths:
      - 'src/game.css'
      - 'src/game.js'
      - 'tests/browser/decor-scroll.spec.js'
      - '.github/workflows/decor-scroll.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome msedge
      - run: npx playwright test tests/browser/decor-scroll.spec.js --project=chrome --project=edge --project=webkit --workers=2 --retries=0 --max-failures=6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decor-scroll-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
