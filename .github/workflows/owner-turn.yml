name: Owner turn focused browser
on:
  pull_request:
    paths:
      - 'src/owner-peek.js'
      - 'src/game.css'
      - 'public/game-art/owner-heads-soft-v3.webp'
      - 'tests/browser/owner-peek.spec.js'
      - '.github/workflows/owner-turn.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome
      - run: npx playwright test tests/browser/owner-peek.spec.js --project=chrome --project=webkit --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-turn-evidence
          path: test-results/
          retention-days: 7
