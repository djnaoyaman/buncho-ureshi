name: Verify educational photo cutout
on:
  pull_request:
    paths:
      - 'src/app.js'
      - 'src/visuals.js'
      - 'src/style.css'
      - 'tests/body-cutout.test.js'
      - 'tests/browser/body-cutout.spec.js'
      - '.github/workflows/body-photo.yml'
  workflow_dispatch:
    inputs:
      public_url:
        description: 'Optional already-deployed site URL to verify'
        default: ''
        required: false
permissions:
  contents: read
jobs:
  photo-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/body-cutout.test.js tests/photo-refinements.test.js tests/brand.test.js
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome
      - name: Inspect photo, credits, all seven detail controls and preserved saves
        env:
          PUBLIC_URL: ${{ inputs.public_url }}
        run: npx playwright test tests/browser/body-cutout.spec.js --project=chrome --project=webkit --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: body-photo-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
