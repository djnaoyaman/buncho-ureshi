name: Field and game regression audit
on:
  pull_request:
    paths:
      - 'tests/browser/fields.spec.js'
      - 'tests/browser/game.spec.js'
      - '.github/workflows/fields-game-audit.yml'
permissions:
  contents: read
jobs:
  fields-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test tests/browser/fields.spec.js tests/browser/game.spec.js --project=chrome --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fields-game-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
