name: Family alignment
on:
  pull_request:
    paths:
      - 'src/family-layout.js'
      - 'src/game.js'
      - 'src/game.css'
      - 'tests/family-layout.test.js'
      - 'tests/browser/family-alignment.spec.js'
      - 'playwright.family-alignment.config.js'
      - '.github/workflows/family-alignment.yml'
permissions:
  contents: read
jobs:
  family:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome
      - run: npx playwright test --config=playwright.family-alignment.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-alignment-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
