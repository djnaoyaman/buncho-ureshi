name: Editorial photographs
on:
  pull_request:
    paths: ['src/app.js', 'src/style.css', 'tests/editorial-photos.test.js', 'tests/browser/editorial-photos.spec.js', 'playwright.editorial.config.js', '.github/workflows/editorial-photos.yml']
  push:
    branches: [main]
    paths: ['src/app.js', 'src/style.css', 'tests/editorial-photos.test.js', 'tests/browser/editorial-photos.spec.js', 'playwright.editorial.config.js', '.github/workflows/editorial-photos.yml']
permissions:
  contents: read
jobs:
  photographs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/editorial-photos.test.js tests/photo-refinements.test.js
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.editorial.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-photos-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
