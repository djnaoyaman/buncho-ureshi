name: Protagonist succession
on:
  pull_request:
    paths:
      - 'src/protagonist.js'
      - 'src/engine.js'
      - 'src/game.js'
      - 'tests/protagonist.test.js'
      - 'tests/family-successor.test.js'
      - 'tests/family-successor-ui.test.js'
      - 'tests/browser/protagonist.spec.js'
      - 'tests/browser/family-successor.spec.js'
      - 'playwright.protagonist.config.js'
      - '.github/workflows/protagonist.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/protagonist.test.js tests/family-successor.test.js tests/family-successor-ui.test.js
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.protagonist.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protagonist-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protagonist-screenshots-${{ github.sha }}
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 14
