name: Studio viewport evidence
on:
  pull_request:
    paths:
      - 'src/studio.js'
      - 'src/studio.css'
      - 'tests/browser/studio-viewport.spec.js'
      - '.github/workflows/studio-viewport.yml'
permissions:
  contents: read
concurrency:
  group: studio-viewport-${{ github.ref }}
  cancel-in-progress: true
jobs:
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Preview visibility and edit lifecycle
        run: npx playwright test tests/browser/studio-viewport.spec.js tests/browser/studio.spec.js --project=${{ matrix.browser }} --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-viewport-${{ matrix.browser }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
