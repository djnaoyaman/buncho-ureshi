name: Color Play presentation
on:
  pull_request:
    paths:
      - 'src/game.css'
      - 'tests/color-play.test.js'
      - 'tests/browser/color-play.spec.js'
      - 'playwright.color-play.config.js'
      - '.github/workflows/color-play.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  color-play:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome
      - run: npx playwright test --config=playwright.color-play.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: color-play-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Use the official Chrome supplied by the runner
        run: google-chrome --version || npx playwright install chrome
      - run: npx playwright test --config=playwright.color-play.config.js --project=color-play-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: color-play-preview-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Verify scene access, captions and live garden behavior
        if: always()
        run: npx playwright test tests/browser/full-stage.spec.js tests/browser/garden-interaction.spec.js tests/browser/garden-protagonist.spec.js tests/browser/garden-social.spec.js --project=chrome --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: color-play-layout-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
