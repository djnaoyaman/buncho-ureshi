name: Garden music transitions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome
      - name: Provide native audio output
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio sink_properties=device.description=CI_Audio
          pactl set-default-sink ci_audio
      - name: Verify all twelve tracks, actual transitions, mute and rapid input
        run: npx playwright test tests/browser/garden-music.spec.js --project=chrome --project=webkit --retries=0
      - name: Verify new gardens on phone and desktop
        run: npx playwright test --config=playwright.twelve-gardens.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garden-music-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
