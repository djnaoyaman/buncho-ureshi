name: Save round-trip audit
on:
  pull_request:
    paths:
      - 'src/game.js'
      - 'src/game-store.js'
      - 'src/engine.js'
      - 'src/care-schedule.js'
      - 'tests/browser/save-roundtrip.spec.js'
      - '.github/workflows/save-roundtrip.yml'
permissions:
  contents: read
jobs:
  save-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/replacement-store.test.js tests/game-store.test.js
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome msedge
      - run: npx playwright test tests/browser/save-roundtrip.spec.js --project=${{ matrix.browser }} --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-roundtrip-${{ matrix.browser }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
