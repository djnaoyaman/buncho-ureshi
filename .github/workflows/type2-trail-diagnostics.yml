name: Type II causal native probes (draft only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  trail_preflight:
    name: Type II normal hosted preflight (not deployable)
    if: github.event.pull_request.draft && startsWith(github.head_ref, 'qa/type2-seven-')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    outputs:
      source_fingerprint: ${{ steps.source.outputs.fingerprint }}
    steps:
      - name: Fetch the exact PR merge commit and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify hosted merge commit and fingerprint the reviewed files
        id: source
        run: |
          set -eu
          sha="$(git rev-parse --verify HEAD)"
          test "$sha" = "$GITHUB_SHA"
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, appendFileSync } from 'node:fs';
          const files = ['.github/browser-checks.json','.github/workflows/pages.yml','package.json','package-lock.json',
            'scripts/build.mjs','src/encounter-ui.js','src/garden-actor-motion.js','src/garden-trail-runtime.js','src/garden-trail-clearance.js',
            'tests/browser/garden-trail-causal.spec.js','tests/fixtures/garden-terrain-browser.js'];
          const hash = createHash('sha256');
          for (const path of files) {
            const bytes = readFileSync(path);
            hash.update(path+'\0'+bytes.length+'\0').update(bytes);
          }
          const actual=hash.digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT,'fingerprint='+actual+'\n');
          NODE
      - name: Verify reviewed live base is fetched
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          test "$PR_BASE" = '41bd702712ef9af1c1c80b6322f5351be1ef6bb8'
          git cat-file -e "$PR_BASE^{commit}"
      - name: Verify reviewed manifest path and exact seven-garden case
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          const manifest=JSON.parse(readFileSync('.github/browser-checks.json','utf8'));
          const expected='tests/browser/garden-trail-seven.spec.js';
          if(manifest.base!==process.env.PR_BASE||!Array.isArray(manifest.tests)||
             manifest.tests.length!==1||manifest.tests[0]!==expected||!existsSync(expected))
            throw Error('Unexpected reviewed manifest');
          NODE
      - name: Run the ordinary source-diff scope selector
        run: node scripts/browser-scope.mjs
      - run: npm ci
      - name: Ordinary syntax and content checks
        run: npm run check
      - name: Ordinary Node tests and protected build ledger
        run: npm test
      - name: Ordinary build output
        run: npm run build

  private_trail_diagnostic:
    name: Type II browser diagnostics (not deployable)
    needs: trail_preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: Fetch the same event merge commit
        id: checkout_source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify checkout receipt when a Git checkout was used
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CHECKED_OUT_SHA: ${{ steps.checkout_source.outputs.commit }}
        run: |
          set -eu
          case "$EXPECTED_SHA" in ''|*[!0-9a-f]*) exit 1;; esac
          test "${#EXPECTED_SHA}" -eq 40
          if [ -n "$CHECKED_OUT_SHA" ]; then test "$CHECKED_OUT_SHA" = "$EXPECTED_SHA"; fi
      - name: Verify browser reviewed files equal hosted preflight
        env:
          HOSTED_FINGERPRINT: ${{ needs.trail_preflight.outputs.source_fingerprint }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, appendFileSync } from 'node:fs';
          const files = ['.github/browser-checks.json','.github/workflows/pages.yml','package.json','package-lock.json',
            'scripts/build.mjs','src/encounter-ui.js','src/garden-actor-motion.js','src/garden-trail-runtime.js','src/garden-trail-clearance.js',
            'tests/browser/garden-trail-causal.spec.js','tests/fixtures/garden-terrain-browser.js'];
          const hash = createHash('sha256');
          for (const path of files) {
            const bytes = readFileSync(path);
            hash.update(path+'\0'+bytes.length+'\0').update(bytes);
          }
          const actual=hash.digest('hex');
          if (!/^[0-9a-f]{64}$/.test(process.env.HOSTED_FINGERPRINT||'') ||
              actual!==process.env.HOSTED_FINGERPRINT) process.exit(1);
          NODE
      - run: npm ci
      - name: Rebuild same-source browser fixture without transferring files
        run: npm run build
      - name: Require the browser image and installed Playwright versions to match
        run: node -e "if(require('@playwright/test/package.json').version !== '1.64.1') throw Error('Update official browser image to match Playwright');"
      - name: Install official Google Chrome using prepared dependencies
        timeout-minutes: 5
        run: |
          curl --fail --location --retry 2 --max-time 120 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb --output /tmp/google-chrome.deb
          dpkg-deb --extract /tmp/google-chrome.deb /
          ldd /opt/google/chrome/chrome > /tmp/chrome-libraries.txt
          if grep -q 'not found' /tmp/chrome-libraries.txt; then exit 1; fi
          /opt/google/chrome/chrome --version
      - name: Prepare real media device
        run: |
          apt-get update -qq
          apt-get install -y pulseaudio pulseaudio-utils ffmpeg
          export PULSE_RUNTIME_PATH=/tmp/ci-pulse-runtime
          export PULSE_STATE_PATH=/tmp/ci-pulse-state
          mkdir -p "$PULSE_RUNTIME_PATH" "$PULSE_STATE_PATH" /tmp/ci-pulse-home
          echo "PULSE_RUNTIME_PATH=$PULSE_RUNTIME_PATH" >> "$GITHUB_ENV"
          HOME=/tmp/ci-pulse-home pulseaudio --daemonize=yes --exit-idle-time=-1 --log-target=stderr
          pactl load-module module-null-sink sink_name=ci_audio sink_properties=device.description=CI_Audio
          pactl set-default-sink ci_audio

      - name: Verify original gate discovery in both engines
        id: ready
        run: |
          set -eu
          report="$(npx playwright test tests/browser/garden-trail-causal.spec.js --grep '@causal-maximum-fit' --project=chrome --project=webkit --list)"
          printf '%s\n' "$report" | grep -Eq "^Total: 2 tests in 1 file$"
      - name: '09 original strict acceptance, with read-only runtime observations'
        id: strict
        timeout-minutes: 4
        env:
          TRAIL_STAGE_TELEMETRY: '1'
        run: |
          rm -f /tmp/type-ii-stage-chrome.json /tmp/type-ii-stage-webkit.json
          npx playwright test tests/browser/garden-trail-causal.spec.js --grep '@causal-maximum-fit' --project=chrome --project=webkit --retries=0 --reporter=line

      - name: Collect each browser checkpoint independently
        id: verify
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const routes=['garden-actor-motion','garden-trail-clearance','garden-trail-runtime'];
          for(const engine of ['chrome','webkit']){
            let note;
            try { note=JSON.parse(readFileSync('/tmp/type-ii-stage-'+engine+'.json','utf8')); } catch { note={}; }
            const p=note.probe, flags={
              receipt:note.project===engine,
              routes:routes.every(key=>note.routes?.[key]?.fulfilled>0&&!note.routes[key].bad),
              setup:note.setup===true,
              snapshot:note.snapshot===true,
              trace:note.trace===true,
              probe:!!p&&Number.isInteger(p.actors)&&Number.isInteger(p.checks)&&Number.isInteger(p.probes)&&Array.isArray(p.native)&&Array.isArray(p.choices)&&typeof p.causes==='object',
              strict:note.strict===true,
            };
            flags.exact=flags.receipt&&flags.routes&&flags.setup&&flags.snapshot&&flags.trace&&flags.probe&&p.actors===10;
            if(flags.exact)Object.assign(flags,{
              fallback:note.motion==='trail-blocked-placement',
              retained:p.peers>0,
              no_seat:p.choices.some(n=>n===0),
              check_cap:p.checks>=p.maxChecks,
              solver_forward:p.solver==='forward',
              branch_cap:p.solver==='forward'&&p.branches>p.maxBranches,
              pair_rejected:p.pairRejects>0,
              cache_used:p.cacheHits>0,
              pair_probes:p.pairMisses>0,
              guard_denied:p.guardDenied>0,
              geometric_leaf:p.leaves>0,
              exhausted:p.solver==='forward'&&p.planned!==p.actors&&p.checks<p.maxChecks&&p.branches<=p.maxBranches&&p.probes<p.maxProbes,

              probe_cap:p.probes>=p.maxProbes,
              native_rejected:p.native.some(n=>n!=='accepted'),
              native_other_hit:p.native.includes('other-hit'),
              native_bird_hit:p.native.includes('bird-hit'),
              peer_rejected:p.causes['partial-peer']>0,
              standing_rejected:p.causes['empty-canStand']>0,
              complete_plan:p.probes>0||p.native.length>0||p.planned===p.actors,
              accepted:p.planned===p.actors,
              reconcile_short:p.planned===p.actors&&Number.isInteger(p.reconciled)&&p.reconciled!==p.actors,
            });
            for(const [key,value] of Object.entries(flags))appendFileSync(process.env.GITHUB_OUTPUT,engine+'_'+key+'='+value+'\n');
          }
          NODE
      - name: 'chrome: test-side checkpoint exists'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_receipt }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: all exact served route anchors fulfilled'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_routes }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: maximum fixture reached ready'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_setup }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: strict snapshot captured'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_snapshot }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: browser trace initialized'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_trace }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: terminal solver counters captured'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_probe }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: individually passed original 09'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_strict }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: terminal probe belongs to the ten native birds'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_exact }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: not in placement fallback'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_fallback }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: terminal pack had no retained peers'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_retained }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: no actor lacked a unary seat'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_no_seat }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: comparison bound not hit'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_check_cap }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: native probe bound not hit'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_probe_cap }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: no complete plan rejected by native hit test'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_native_rejected }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: no failed native probe hit a non-bird element'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_native_other_hit }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: no failed native probe hit another bird'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_native_bird_hit }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: no peer collision encountered'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_peer_rejected }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: no unary standing rejection'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_standing_rejected }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: reached a complete geometric plan'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_complete_plan }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: accepted a measured plan for all ten'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_accepted }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: no accepted complete plan reconciled short'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_reconcile_short }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: test-side checkpoint exists'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_receipt }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: all exact served route anchors fulfilled'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_routes }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: maximum fixture reached ready'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_setup }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: strict snapshot captured'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_snapshot }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: browser trace initialized'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_trace }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: terminal solver counters captured'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_probe }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: individually passed original 09'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_strict }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: terminal probe belongs to the ten native birds'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_exact }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: not in placement fallback'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_fallback }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: terminal pack had no retained peers'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_retained }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: no actor lacked a unary seat'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_no_seat }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: comparison bound not hit'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_check_cap }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: native probe bound not hit'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_probe_cap }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: no complete plan rejected by native hit test'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_native_rejected }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: no failed native probe hit a non-bird element'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_native_other_hit }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: no failed native probe hit another bird'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_native_bird_hit }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: no peer collision encountered'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_peer_rejected }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: no unary standing rejection'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_standing_rejected }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: reached a complete geometric plan'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_complete_plan }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: accepted a measured plan for all ten'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_accepted }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: no accepted complete plan reconciled short'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_reconcile_short }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: fresh optimized solver executed'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_solver_forward }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: no optimized branch bound hit'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_branch_cap }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: no pairwise cache misses rejected for peer collision'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_pair_rejected }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: cached pairwise result reused'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_cache_used }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: pairwise fresh comparisons executed'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_pair_probes }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: no complete geometric leaf denied by full runtime guard'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_guard_denied }}
        run: test "$OBSERVED" = 'false'
      - name: 'chrome: reached at least one complete geometric leaf'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_geometric_leaf }}
        run: test "$OBSERVED" = 'true'
      - name: 'chrome: did not exhaust all branches while below every bound'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.chrome_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.chrome_exhausted }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: fresh optimized solver executed'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_solver_forward }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: no optimized branch bound hit'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_branch_cap }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: no pairwise cache misses rejected for peer collision'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_pair_rejected }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: cached pairwise result reused'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_cache_used }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: pairwise fresh comparisons executed'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_pair_probes }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: no complete geometric leaf denied by full runtime guard'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_guard_denied }}
        run: test "$OBSERVED" = 'false'
      - name: 'webkit: reached at least one complete geometric leaf'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_geometric_leaf }}
        run: test "$OBSERVED" = 'true'
      - name: 'webkit: did not exhaust all branches while below every bound'
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.webkit_exact == 'true' }}
        env:
          OBSERVED: ${{ steps.verify.outputs.webkit_exhausted }}
        run: test "$OBSERVED" = 'false'
