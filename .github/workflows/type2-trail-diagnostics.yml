        run: node -e 'const fs=require("fs"),path=require("path");const s=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,"type2-interior-stage-verdicts",process.env.TYPE2_CHECK_FILE),"utf8"));const v=s[process.env.TYPE2_CHECK_KEY];process.exit(v==="pass"||v==="direct"?0:1);'
      - name: '#14 webkit landing'
        env:
          TYPE2_CHECK_FILE: '14-webkit.json'
          TYPE2_CHECK_KEY: 'landing'
        if: ${{ !cancelled() && steps.interior_stages.outcome == 'success' }}
        run: node -e 'const fs=require("fs"),path=require("path");const s=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,"type2-interior-stage-verdicts",process.env.TYPE2_CHECK_FILE),"utf8"));const v=s[process.env.TYPE2_CHECK_KEY];process.exit(v==="pass"||v==="direct"?0:1);'

      - name: Remove the bounded scratch verdicts
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/type2-interior-stage-verdicts/10-chrome.json" "$RUNNER_TEMP/type2-interior-stage-verdicts/10-webkit.json" "$RUNNER_TEMP/type2-interior-stage-verdicts/14-chrome.json" "$RUNNER_TEMP/type2-interior-stage-verdicts/14-webkit.json"
