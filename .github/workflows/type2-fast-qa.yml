name: Type II fast dense-rotate-recover QA (no deployment)
run-name: Type II focused dense-rotate-recover · ${{ github.sha }}
on:
  push:
    branches: [qa/type2-fast-dense]
permissions:
  contents: read
concurrency:
  group: type2-fast-dense-rotate-recover-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visitor:
    name: 'Type II dense-rotate-recover · ${{ matrix.engine }}'
    if: github.ref == 'refs/heads/qa/type2-fast-dense'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: Check out the exact non-release source
        id: source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify fixture and install pinned dependencies
        env:
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
        run: |
          set -eu
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          node --check tests/browser/garden-trail-seven-checkpoints.spec.js
          node --check tests/browser/garden-trail-seven.spec.js
          node --check src/garden-actor-motion.js
          node --check src/garden-trail-clearance.js
          npm ci
          node -e "if(require('@playwright/test/package.json').version !== '1.64.1') process.exit(1)"
      - name: Build the exact game under test
        run: npm run build
      - name: Install only the actual Chrome binary when selected
        if: matrix.engine == 'chrome'
        timeout-minutes: 4
        run: |
          set -eu
          curl --fail --location --retry 2 --max-time 100 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb --output /tmp/google-chrome.deb
          dpkg-deb --extract /tmp/google-chrome.deb /
          ldd /opt/google/chrome/chrome > /tmp/chrome-libraries.txt
          if grep -q 'not found' /tmp/chrome-libraries.txt; then exit 1; fi
          /opt/google/chrome/chrome --version
      - name: Discover and run only this affected cohort
        id: focused
        timeout-minutes: 7
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/type2-focused-receipts"
          mkdir -m 700 "$dir"
          report="$(npx playwright test tests/browser/garden-trail-seven-checkpoints.spec.js --grep '(08|10) dense exact bounds' --project="$ENGINE" --list)"
          printf '%s\n' "$report" | grep -Eq '^Total: 2 tests in 1 file$'
          rc=0
          TYPE2_CHECKPOINT_DIR="$dir" npx playwright test tests/browser/garden-trail-seven-checkpoints.spec.js --grep '(08|10) dense exact bounds' --project="$ENGINE" --retries=0 --max-failures=0 --trace=off --reporter=dot >/dev/null 2>&1 || rc="$?"
          test "$rc" -le 1
          node -e 'const f=require("fs");const [d,e,q]=process.argv.slice(1);for(const [k,choices] of JSON.parse(q))if(!choices.includes(f.readFileSync(d+"/"+e+"-"+k,"utf8").trim()))process.exit(1);' "$dir" "$ENGINE" '[["08-dense",["pass","setup","preview","portrait-one-ready","portrait-one-native","portrait-one-qualified","tap-open","tap-close","landscape-ready","landscape-identities","landscape-width","landscape-height","landscape-viewport","landscape-hit","portrait-two-native","motion-native","motion-unseen"]],["10-dense",["pass","setup","preview","portrait-one-ready","portrait-one-native","portrait-one-qualified","tap-open","tap-close","landscape-ready","landscape-identities","landscape-width","landscape-height","landscape-viewport","landscape-hit","portrait-two-native","motion-native","motion-unseen"]]]'
      - name: Validate failed-hit sidecars when the original assertion failed
        id: hit_focus
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const kinds=['stale','unavailable','noninteractive','none','device-notice','bird-sheet','real-modal','peer','garden-ui','scene-other','other'];
          const modes=['trail-active','trail-held','trail-standing','trail-blocked-placement','trail-blocked-geometry','trail-needs-recovery','geometry-blocked','insufficient-space','other'];
          for(const garden of ['08','10']){
           const path=process.env.RUNNER_TEMP+'/type2-focused-receipts/'+process.env.ENGINE+'-'+garden+'-dense';
           if(readFileSync(path,'utf8').trim()!=='landscape-hit')continue;
           const d=JSON.parse(readFileSync(path+'.hit.json','utf8'));
           if(!kinds.includes(d.kind)||!modes.includes(d.mode)||!['bound','unbound'].includes(d.rendered)||typeof d.blocked!=='boolean'||!['none','orientation','device'].includes(d.persistent))throw Error('Unknown fixed sidecar enum');
           for(const k of ['kind','mode','rendered','blocked','persistent'])appendFileSync(process.env.GITHUB_OUTPUT,'g'+garden+'_'+k+'='+d[k]+'\n');
          }
          NODE
      - name: '#08 failed landscape hit not kind-peer'
        if: ${{ !cancelled() && steps.hit_focus.outcome == 'success' && steps.hit_focus.outputs.g08_kind != '' }}
        env:
          OBSERVED: ${{ steps.hit_focus.outputs.g08_kind }}
        run: test "$OBSERVED" != "peer"
      - name: '#08 failed landscape hit not kind-garden-ui'
        if: ${{ !cancelled() && steps.hit_focus.outcome == 'success' && steps.hit_focus.outputs.g08_kind != '' }}
