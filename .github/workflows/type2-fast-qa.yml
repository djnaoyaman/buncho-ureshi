        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-07-visitor")" != "mixed-loading"
      - name: '#07 visitor not mixed-qualified'
