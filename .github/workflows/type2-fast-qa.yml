name: Type II fast route-rebind QA (no deployment)
run-name: Type II focused route-rebind · ${{ github.sha }}
on:
  push:
    branches: [qa/type2-fast-palette]
permissions:
  contents: read
concurrency:
  group: type2-fast-route-rebind-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visitor:
    name: 'Type II route-rebind · ${{ matrix.engine }}'
    if: github.ref == 'refs/heads/qa/type2-fast-palette'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: Check out the exact non-release source
        id: source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify fixture and install pinned dependencies
        env:
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
        run: |
          set -eu
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          node --check tests/browser/garden-trail-08-flight-route.spec.js
          node --check tests/browser/garden-trail-seven.spec.js
          node --check src/garden-trail-adapter.js
          node --check tests/browser/garden-trail-seven-checkpoints.spec.js
          npm ci
          node -e "if(require('@playwright/test/package.json').version !== '1.64.1') process.exit(1)"
      - name: Build the exact game under test
        run: npm run build
      - name: Install only the actual Chrome binary when selected
        if: matrix.engine == 'chrome'
        timeout-minutes: 4
        run: |
          set -eu
          curl --fail --location --retry 2 --max-time 100 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb --output /tmp/google-chrome.deb
          dpkg-deb --extract /tmp/google-chrome.deb /
          ldd /opt/google/chrome/chrome > /tmp/chrome-libraries.txt
          if grep -q 'not found' /tmp/chrome-libraries.txt; then exit 1; fi
          /opt/google/chrome/chrome --version
      - name: Discover and run only this affected cohort
        id: focused
        timeout-minutes: 7
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/type2-focused-receipts"
          mkdir -m 700 "$dir"
          report="$(npx playwright test tests/browser/garden-trail-08-flight-route.spec.js tests/browser/garden-trail-seven-checkpoints.spec.js --grep '(08 real path and paint|(07|08|12|28|34) exact visitor mutation and native tap)' --project="$ENGINE" --list)"
          printf '%s\n' "$report" | grep -Eq '^Total: 9 tests in 2 files$'
          rc=0
          TYPE2_CHECKPOINT_DIR="$dir" npx playwright test tests/browser/garden-trail-08-flight-route.spec.js tests/browser/garden-trail-seven-checkpoints.spec.js --grep '(08 real path and paint|(07|08|12|28|34) exact visitor mutation and native tap)' --project="$ENGINE" --retries=0 --max-failures=0 --trace=off --reporter=dot || rc="$?"
          test "$rc" -le 1
          node -e 'const f=require("fs");const [d,e,q]=process.argv.slice(1);for(const [k,choices] of JSON.parse(q))if(!choices.includes(f.readFileSync(d+"/"+e+"-"+k,"utf8").trim()))process.exit(1);' "$dir" "$ENGINE" '[["08-route-white",["pass","setup","launch-timeout","completion-timeout","geometry-rejected","scene-replaced","rerouted","wrong-contact","phase-absent","paint-not-visible-decoded","landing-native","landing-tap","pass-late-contact"]],["08-route-sakura",["pass","setup","launch-timeout","completion-timeout","geometry-rejected","scene-replaced","rerouted","wrong-contact","phase-absent","paint-not-visible-decoded","landing-native","landing-tap","pass-late-contact"]],["08-route-cinnamon",["pass","setup","launch-timeout","completion-timeout","geometry-rejected","scene-replaced","rerouted","wrong-contact","phase-absent","paint-not-visible-decoded","landing-native","landing-tap","pass-late-contact"]],["08-route-silver",["pass","setup","launch-timeout","completion-timeout","geometry-rejected","scene-replaced","rerouted","wrong-contact","phase-absent","paint-not-visible-decoded","landing-native","landing-tap","pass-late-contact"]],["07-visitor",["pass","setup","flight-before","store-change","store-queue","visitor-dom","visitor-ready","mixed-loading","mixed-qualified","mixed-unqualified","contact-missing-trail-blocked-placement","contact-missing-trail-blocked-geometry","contact-missing-trail-needs-recovery","contact-missing-geometry-blocked","contact-missing-insufficient-space","contact-missing-trail-held","contact-missing-trail-active","contact-missing-trail-standing","contact-missing-other","contact-advanced-to-target","contact-different","visitor-tap"]],["08-visitor",["pass","setup","flight-before","store-change","store-queue","visitor-dom","visitor-ready","mixed-loading","mixed-qualified","mixed-unqualified","contact-missing-trail-blocked-placement","contact-missing-trail-blocked-geometry","contact-missing-trail-needs-recovery","contact-missing-geometry-blocked","contact-missing-insufficient-space","contact-missing-trail-held","contact-missing-trail-active","contact-missing-trail-standing","contact-missing-other","contact-advanced-to-target","contact-different","visitor-tap"]],["12-visitor",["pass","setup","flight-before","store-change","store-queue","visitor-dom","visitor-ready","mixed-loading","mixed-qualified","mixed-unqualified","contact-missing-trail-blocked-placement","contact-missing-trail-blocked-geometry","contact-missing-trail-needs-recovery","contact-missing-geometry-blocked","contact-missing-insufficient-space","contact-missing-trail-held","contact-missing-trail-active","contact-missing-trail-standing","contact-missing-other","contact-advanced-to-target","contact-different","visitor-tap"]],["28-visitor",["pass","setup","flight-before","store-change","store-queue","visitor-dom","visitor-ready","mixed-loading","mixed-qualified","mixed-unqualified","contact-missing-trail-blocked-placement","contact-missing-trail-blocked-geometry","contact-missing-trail-needs-recovery","contact-missing-geometry-blocked","contact-missing-insufficient-space","contact-missing-trail-held","contact-missing-trail-active","contact-missing-trail-standing","contact-missing-other","contact-advanced-to-target","contact-different","visitor-tap"]],["34-visitor",["pass","setup","flight-before","store-change","store-queue","visitor-dom","visitor-ready","mixed-loading","mixed-qualified","mixed-unqualified","contact-missing-trail-blocked-placement","contact-missing-trail-blocked-geometry","contact-missing-trail-needs-recovery","contact-missing-geometry-blocked","contact-missing-insufficient-space","contact-missing-trail-held","contact-missing-trail-active","contact-missing-trail-standing","contact-missing-other","contact-advanced-to-target","contact-different","visitor-tap"]]]'
      - name: '#08 white complete'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-route-white")" = pass || test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-route-white")" = pass-late-contact
      - name: '#08 white not setup'
