name: Type II fast dense-measured QA (no deployment)
run-name: Type II focused dense-measured · ${{ github.sha }}
on:
  push:
    branches: [qa/type2-fast-dense]
permissions:
  contents: read
concurrency:
  group: type2-fast-dense-measured-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visitor:
    name: 'Type II dense-measured · ${{ matrix.engine }}'
    if: github.ref == 'refs/heads/qa/type2-fast-dense'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: Check out the exact non-release source
        id: source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify fixture and install pinned dependencies
        env:
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
        run: |
          set -eu
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          node --check tests/browser/garden-trail-dense-measured.spec.js
          node --check tests/browser/garden-trail-seven.spec.js
          npm ci
          node -e "if(require('@playwright/test/package.json').version !== '1.64.1') process.exit(1)"
      - name: Build the exact game under test
        run: npm run build
      - name: Install only the actual Chrome binary when selected
        if: matrix.engine == 'chrome'
        timeout-minutes: 4
        run: |
          set -eu
          curl --fail --location --retry 2 --max-time 100 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb --output /tmp/google-chrome.deb
          dpkg-deb --extract /tmp/google-chrome.deb /
          ldd /opt/google/chrome/chrome > /tmp/chrome-libraries.txt
          if grep -q 'not found' /tmp/chrome-libraries.txt; then exit 1; fi
          /opt/google/chrome/chrome --version
      - name: Discover and run only this affected cohort
        id: focused
        timeout-minutes: 7
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/type2-focused-receipts"
          mkdir -m 700 "$dir"
          report="$(npx playwright test tests/browser/garden-trail-dense-measured.spec.js --project="$ENGINE" --list)"
          printf '%s\n' "$report" | grep -Eq '^Total: 2 tests in 1 file$'
          rc=0
          TYPE2_CHECKPOINT_DIR="$dir" npx playwright test tests/browser/garden-trail-dense-measured.spec.js --project="$ENGINE" --retries=0 --max-failures=0 --trace=off --reporter=dot || rc="$?"
          test "$rc" -le 1
          node -e 'const f=require("fs");const [d,e,q]=process.argv.slice(1);for(const [k,choices] of JSON.parse(q))if(!choices.includes(f.readFileSync(d+"/"+e+"-"+k,"utf8").trim()))process.exit(1);' "$dir" "$ENGINE" '[["08-dense-measured",["pass","hook-unverified","placement-unclassified","other-assertion","measured-ten-real-hits","measured-ten-hit-rejected","measured-ten-native-not-ready","contour-native-rejected","retained","unary-not-ten","sample-budget-ended","sample-no-ten","replay-not-reached"]],["10-dense-measured",["pass","hook-unverified","placement-unclassified","other-assertion","measured-ten-real-hits","measured-ten-hit-rejected","measured-ten-native-not-ready","contour-native-rejected","retained","unary-not-ten","sample-budget-ended","sample-no-ten","replay-not-reached"]]]'
      - name: '#08 actual geometry complete'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-dense-measured")" = pass
      - name: '#08 actual geometry not hook-unverified'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-dense-measured")" != "hook-unverified"
      - name: '#08 actual geometry not placement-unclassified'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-dense-measured")" != "placement-unclassified"
      - name: '#08 actual geometry not other-assertion'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-dense-measured")" != "other-assertion"
      - name: '#08 actual geometry not measured-ten-real-hits'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-dense-measured")" != "measured-ten-real-hits"
      - name: '#08 actual geometry not measured-ten-hit-rejected'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-dense-measured")" != "measured-ten-hit-rejected"
      - name: '#08 actual geometry not measured-ten-native-not-ready'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-dense-measured")" != "measured-ten-native-not-ready"
      - name: '#08 actual geometry not contour-native-rejected'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-dense-measured")" != "contour-native-rejected"
      - name: '#08 actual geometry not retained'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-dense-measured")" != "retained"
      - name: '#08 actual geometry not unary-not-ten'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-dense-measured")" != "unary-not-ten"
      - name: '#08 actual geometry not sample-budget-ended'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-dense-measured")" != "sample-budget-ended"
      - name: '#08 actual geometry not sample-no-ten'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-dense-measured")" != "sample-no-ten"
      - name: '#08 actual geometry not replay-not-reached'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-dense-measured")" != "replay-not-reached"
      - name: '#10 actual geometry complete'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-10-dense-measured")" = pass
      - name: '#10 actual geometry not hook-unverified'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-10-dense-measured")" != "hook-unverified"
      - name: '#10 actual geometry not placement-unclassified'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-10-dense-measured")" != "placement-unclassified"
      - name: '#10 actual geometry not other-assertion'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-10-dense-measured")" != "other-assertion"
      - name: '#10 actual geometry not measured-ten-real-hits'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-10-dense-measured")" != "measured-ten-real-hits"
      - name: '#10 actual geometry not measured-ten-hit-rejected'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-10-dense-measured")" != "measured-ten-hit-rejected"
      - name: '#10 actual geometry not measured-ten-native-not-ready'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-10-dense-measured")" != "measured-ten-native-not-ready"
      - name: '#10 actual geometry not contour-native-rejected'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-10-dense-measured")" != "contour-native-rejected"
      - name: '#10 actual geometry not retained'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-10-dense-measured")" != "retained"
      - name: '#10 actual geometry not unary-not-ten'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-10-dense-measured")" != "unary-not-ten"
      - name: '#10 actual geometry not sample-budget-ended'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-10-dense-measured")" != "sample-budget-ended"
      - name: '#10 actual geometry not sample-no-ten'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-10-dense-measured")" != "sample-no-ten"
      - name: '#10 actual geometry not replay-not-reached'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-10-dense-measured")" != "replay-not-reached"
      - name: Clear temporary receipts only
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/type2-focused-receipts"
