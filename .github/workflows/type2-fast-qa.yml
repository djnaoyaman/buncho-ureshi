        run: test "$OBSERVED" != "trail-standing"
      - name: '#08 failed landscape hit not mode-trail-blocked-placement'
        if: ${{ !cancelled() && steps.hit_focus.outcome == 'success' && steps.hit_focus.outputs.g08_kind != '' }}
        env:
