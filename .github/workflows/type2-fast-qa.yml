name: Type II fast dense QA (no deployment)
run-name: Type II focused dense · ${{ github.sha }}
on:
  push:
    branches: [qa/type2-fast-dense]
permissions:
  contents: read
concurrency:
  group: type2-fast-dense-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visitor:
    name: 'Type II dense · ${{ matrix.engine }}'
    if: github.ref == 'refs/heads/qa/type2-fast-dense'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: Check out the exact non-release source
        id: source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify fixture and install pinned dependencies
        env:
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
        run: |
          set -eu
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          node --check tests/browser/garden-trail-dense-first.spec.js
          node --check tests/browser/garden-trail-seven.spec.js
          npm ci
          node -e "if(require('@playwright/test/package.json').version !== '1.64.1') process.exit(1)"
      - name: Build the exact game under test
        run: npm run build
      - name: Install only the actual Chrome binary when selected
        if: matrix.engine == 'chrome'
        timeout-minutes: 4
        run: |
          set -eu
          curl --fail --location --retry 2 --max-time 100 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb --output /tmp/google-chrome.deb
          dpkg-deb --extract /tmp/google-chrome.deb /
          ldd /opt/google/chrome/chrome > /tmp/chrome-libraries.txt
          if grep -q 'not found' /tmp/chrome-libraries.txt; then exit 1; fi
          /opt/google/chrome/chrome --version
      - name: Discover and run only this affected cohort
        id: focused
        timeout-minutes: 7
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/type2-focused-receipts"
          mkdir -m 700 "$dir"
          report="$(npx playwright test tests/browser/garden-trail-dense-first.spec.js --project="$ENGINE" --list)"
          printf '%s\n' "$report" | grep -Eq '^Total: 3 tests in 1 file$'
          rc=0
          TYPE2_CHECKPOINT_DIR="$dir" npx playwright test tests/browser/garden-trail-dense-first.spec.js --project="$ENGINE" --retries=0 --max-failures=0 --trace=off --reporter=dot || rc="$?"
          test "$rc" -le 1
          node -e 'const f=require("fs");const [d,e,q]=process.argv.slice(1);for(const [k,choices] of JSON.parse(q))if(!choices.includes(f.readFileSync(d+"/"+e+"-"+k,"utf8").trim()))process.exit(1);' "$dir" "$ENGINE" '[["08-dense",["pass","setup","hook-unverified","portrait1-ready","portrait1-native","tap-open","tap-close","landscape-ready","landscape-native","portrait2-ready","portrait2-native","sample-read","sample-native","placement-retained","placement-unary","placement-native","placement-no-pack","motion-no-scheduler","motion-no-local","motion-no-candidates","motion-sweep-denied","motion-route-not-painted","portrait-trail-active","motion-trail-active","portrait-trail-held","motion-trail-held","portrait-trail-standing","motion-trail-standing","portrait-insufficient-space","motion-insufficient-space","portrait-trail-blocked-placement","motion-trail-blocked-placement","portrait-trail-blocked-geometry","motion-trail-blocked-geometry","portrait-trail-needs-recovery","motion-trail-needs-recovery","portrait-geometry-blocked","motion-geometry-blocked","portrait-active","motion-active","portrait-held","motion-held","portrait-other","motion-other"]],["10-dense",["pass","setup","hook-unverified","portrait1-ready","portrait1-native","tap-open","tap-close","landscape-ready","landscape-native","portrait2-ready","portrait2-native","sample-read","sample-native","placement-retained","placement-unary","placement-native","placement-no-pack","motion-no-scheduler","motion-no-local","motion-no-candidates","motion-sweep-denied","motion-route-not-painted","portrait-trail-active","motion-trail-active","portrait-trail-held","motion-trail-held","portrait-trail-standing","motion-trail-standing","portrait-insufficient-space","motion-insufficient-space","portrait-trail-blocked-placement","motion-trail-blocked-placement","portrait-trail-blocked-geometry","motion-trail-blocked-geometry","portrait-trail-needs-recovery","motion-trail-needs-recovery","portrait-geometry-blocked","motion-geometry-blocked","portrait-active","motion-active","portrait-held","motion-held","portrait-other","motion-other"]],["34-dense",["pass","setup","hook-unverified","portrait1-ready","portrait1-native","tap-open","tap-close","landscape-ready","landscape-native","portrait2-ready","portrait2-native","sample-read","sample-native","placement-retained","placement-unary","placement-native","placement-no-pack","motion-no-scheduler","motion-no-local","motion-no-candidates","motion-sweep-denied","motion-route-not-painted","portrait-trail-active","motion-trail-active","portrait-trail-held","motion-trail-held","portrait-trail-standing","motion-trail-standing","portrait-insufficient-space","motion-insufficient-space","portrait-trail-blocked-placement","motion-trail-blocked-placement","portrait-trail-blocked-geometry","motion-trail-blocked-geometry","portrait-trail-needs-recovery","motion-trail-needs-recovery","portrait-geometry-blocked","motion-geometry-blocked","portrait-active","motion-active","portrait-held","motion-held","portrait-other","motion-other"]]]'
      - name: '#08 dense ten complete'
