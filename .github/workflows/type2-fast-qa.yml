        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-route-silver")" != "landing-tap"
      - name: '#08 silver not pass-late-contact'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-route-silver")" != "pass-late-contact"
      - name: Clear temporary receipts only
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/type2-focused-receipts"
