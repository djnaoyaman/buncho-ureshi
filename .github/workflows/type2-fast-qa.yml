name: Type II fast bay-12-west QA (no deployment)
run-name: Type II focused bay-12-west · ${{ github.sha }}
on:
  push:
    branches: [qa/type2-fast-bay-12-west]
permissions:
  contents: read
concurrency:
  group: type2-fast-bay-12-west-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visitor:
    name: 'Type II bay-12-west · ${{ matrix.engine }}'
    if: github.ref == 'refs/heads/qa/type2-fast-bay-12-west'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: Check out the exact non-release source
        id: source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify fixture and install pinned dependencies
        env:
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
        run: |
          set -eu
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          node --check tests/browser/garden-trail-bay-fast.spec.js
          node --check tests/browser/garden-trail-seven.spec.js
          npm ci
          node -e "if(require('@playwright/test/package.json').version !== '1.64.1') process.exit(1)"
      - name: Build the exact game under test
        run: npm run build
      - name: Install only the actual Chrome binary when selected
        if: matrix.engine == 'chrome'
        timeout-minutes: 4
        run: |
          set -eu
          curl --fail --location --retry 2 --max-time 100 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb --output /tmp/google-chrome.deb
          dpkg-deb --extract /tmp/google-chrome.deb /
          ldd /opt/google/chrome/chrome > /tmp/chrome-libraries.txt
          if grep -q 'not found' /tmp/chrome-libraries.txt; then exit 1; fi
          /opt/google/chrome/chrome --version
      - name: Discover and run only this affected cohort
        id: focused
        timeout-minutes: 7
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/type2-focused-receipts"
          mkdir -m 700 "$dir"
          report="$(npx playwright test tests/browser/garden-trail-bay-fast.spec.js --grep @bay-fast-12 --project="$ENGINE" --list)"
          printf '%s\n' "$report" | grep -Eq '^Total: 1 test in 1 file$'
          rc=0
          TYPE2_CHECKPOINT_DIR="$dir" npx playwright test tests/browser/garden-trail-bay-fast.spec.js --grep @bay-fast-12 --project="$ENGINE" --retries=0 --max-failures=0 --trace=off --reporter=dot || rc="$?"
          test "$rc" -le 1
          node -e 'const f=require("fs");const [d,e,q]=process.argv.slice(1);for(const [k,choices] of JSON.parse(q))if(!choices.includes(f.readFileSync(d+"/"+e+"-"+k,"utf8").trim()))process.exit(1);' "$dir" "$ENGINE" '[["12-bay",["pass","route-register","fixture-setup","sample-clock","sample-eval","page-type","page-reference","page-syntax","page-range","page-other","hook-terrain-anchor","hook-terrain-transport","hook-lane-anchor","hook-lane-transport","hook-adapter-anchor","hook-adapter-transport","hook-runtime-anchor","hook-runtime-transport","hook-clearance-anchor","hook-clearance-transport","hook-paint-anchor","hook-paint-transport","native-gates","bay-dom-not-grounded","bay-prospective-cross-denied","bay-receipt-missing","bay-yield-committed-no-ground","bay-yield-fit-no-commit","bay-yield-not-committed","bay-prospective-parked","bay-prospective-renderer","bay-prospective-sweep-unknown","bay-prospective-sweep-destination","bay-prospective-sweep-sweep-unavailable","bay-prospective-sweep-sweep-clip","bay-prospective-sweep-sweep-controls","bay-prospective-sweep-sweep-peer","bay-prospective-sweep-peer-unmeasured","held-ready","dispatch","commit","commit-action-unverified","commit-fly-render-rejected","commit-fly-unpainted","commit-native-hop","native-wing-unpainted","fly-dom-motionless","fly-dom-partner-lost","held-cannot-fly","held-destination","held-ineligible","held-peer-unmeasured","held-preview-constructor","held-preview-cooldown","held-sweep-clip","held-sweep-controls","held-sweep-peer","held-sweep-unavailable","held-unclassified","lane-occupied","same-landing"]]]'
      - name: '#12 west pair complete'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-12-bay")" = pass
      - name: '#12 west pair not route-register'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-12-bay")" != "route-register"
      - name: '#12 west pair not fixture-setup'
