name: Type II fast arrival08 QA (no deployment)
run-name: Type II focused arrival08 · ${{ github.sha }}
on:
  push:
    branches: [qa/type2-fast-arrival08]
permissions:
  contents: read
concurrency:
  group: type2-fast-arrival08-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visitor:
    name: 'Type II arrival08 · ${{ matrix.engine }}'
    if: github.ref == 'refs/heads/qa/type2-fast-arrival08'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: Check out the exact non-release source
        id: source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify fixture and install pinned dependencies
        env:
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
        run: |
          set -eu
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          node --check tests/browser/garden-trail-08-visitor-proof.spec.js
          node --check tests/browser/garden-trail-seven.spec.js
          npm ci
          node -e "if(require('@playwright/test/package.json').version !== '1.64.1') process.exit(1)"
      - name: Build the exact game under test
        run: npm run build
      - name: Install only the actual Chrome binary when selected
        if: matrix.engine == 'chrome'
        timeout-minutes: 4
        run: |
          set -eu
          curl --fail --location --retry 2 --max-time 100 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb --output /tmp/google-chrome.deb
          dpkg-deb --extract /tmp/google-chrome.deb /
          ldd /opt/google/chrome/chrome > /tmp/chrome-libraries.txt
          if grep -q 'not found' /tmp/chrome-libraries.txt; then exit 1; fi
          /opt/google/chrome/chrome --version
      - name: Discover and run only this affected cohort
        id: focused
        timeout-minutes: 7
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/type2-focused-receipts"
          mkdir -m 700 "$dir"
          report="$(npx playwright test tests/browser/garden-trail-08-visitor-proof.spec.js --project="$ENGINE" --list)"
          printf '%s\n' "$report" | grep -Eq '^Total: 1 test in 1 file$'
          rc=0
          TYPE2_CHECKPOINT_DIR="$dir" npx playwright test tests/browser/garden-trail-08-visitor-proof.spec.js --project="$ENGINE" --retries=0 --max-failures=0 --trace=off --reporter=dot || rc="$?"
          test "$rc" -le 1
          node -e 'const f=require("fs");const [d,e,q]=process.argv.slice(1);for(const [k,choices] of JSON.parse(q))if(!choices.includes(f.readFileSync(d+"/"+e+"-"+k,"utf8").trim()))process.exit(1);' "$dir" "$ENGINE" '[["08-arrival",["pass","setup","initial-flight","store-result","visitor-ready","real-visitor-tap","lane-reconcile-denied","lane-native-probe-denied","lane-planner-denied","lane-measured-denied","lane-no-placement-reject","lane-continuity","local-reconcile-denied","local-native-probe-denied","local-planner-denied","local-measured-denied","local-no-placement-reject","local-continuity"]]]'
      - name: '#08 live visitor complete'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" = pass
      - name: '#08 live visitor not setup'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "setup"
      - name: '#08 live visitor not initial-flight'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "initial-flight"
      - name: '#08 live visitor not store-result'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "store-result"
      - name: '#08 live visitor not visitor-ready'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "visitor-ready"
      - name: '#08 live visitor not real-visitor-tap'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "real-visitor-tap"
      - name: '#08 live visitor not lane-reconcile-denied'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "lane-reconcile-denied"
      - name: '#08 live visitor not lane-native-probe-denied'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "lane-native-probe-denied"
      - name: '#08 live visitor not lane-planner-denied'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "lane-planner-denied"
      - name: '#08 live visitor not lane-measured-denied'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "lane-measured-denied"
      - name: '#08 live visitor not lane-no-placement-reject'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "lane-no-placement-reject"
      - name: '#08 live visitor not lane-continuity'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "lane-continuity"
      - name: '#08 live visitor not local-reconcile-denied'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "local-reconcile-denied"
      - name: '#08 live visitor not local-native-probe-denied'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "local-native-probe-denied"
      - name: '#08 live visitor not local-planner-denied'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "local-planner-denied"
      - name: '#08 live visitor not local-measured-denied'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "local-measured-denied"
      - name: '#08 live visitor not local-no-placement-reject'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "local-no-placement-reject"
      - name: '#08 live visitor not local-continuity'
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: test "$(cat "$RUNNER_TEMP/type2-focused-receipts/$ENGINE-08-arrival")" != "local-continuity"
      - name: Clear temporary receipts only
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/type2-focused-receipts"
