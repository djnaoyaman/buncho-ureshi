name: Encounter friendship
on:
  pull_request:
    paths:
      - 'src/encounter*'
      - 'src/engine.js'
      - 'src/game*.js'
      - 'tests/encounter-friendship.test.js'
      - 'tests/browser/encounter-friendship.spec.js'
      - 'playwright.friendship.config.js'
      - '.github/workflows/encounter-friendship.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  friendship:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.friendship.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encounter-friendship-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
