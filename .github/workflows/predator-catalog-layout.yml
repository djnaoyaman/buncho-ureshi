name: Predator catalog layout
on:
  pull_request:
    paths: ['src/encounter-ui.css', 'src/garden-crow-ui.js', 'src/garden-raptor-ui.js', 'tests/predator-catalog-layout.test.js', 'tests/browser/predator-catalog-layout.spec.js', 'playwright.predator-layout.config.js', '.github/workflows/predator-catalog-layout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/predator-catalog-layout.test.js tests/garden-raptor*.test.js tests/garden-crow*.test.js
      - run: npx playwright install --with-deps webkit
      - run: npx playwright install chrome msedge
      - run: npx playwright test --config=playwright.predator-layout.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predator-catalog-layout
          path: |
            playwright-report/
            test-results/
