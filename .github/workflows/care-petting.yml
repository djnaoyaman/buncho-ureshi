name: Direct bird petting
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/game.js'
      - 'src/game.css'
      - 'src/engine.js'
      - 'src/care-schedule.js'
      - 'tests/care-ui.test.js'
      - 'tests/care-art-assets.test.js'
      - 'public/game-art/care-illustrations/**'
      - 'tests/browser/care-direct-petting.spec.js'
      - 'playwright.care-petting.config.js'
      - '.github/workflows/care-petting.yml'
permissions:
  contents: read
jobs:
  care-petting:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome
      - run: npx playwright test --config=playwright.care-petting.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: care-petting-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
