name: Feedback lifetime
on:
  pull_request:
    paths:
      - 'src/game.js'
      - 'src/game-feedback.js'
      - 'tests/game-feedback.test.js'
      - 'tests/browser/feedback-timeout.spec.js'
      - 'playwright.feedback.config.js'
      - '.github/workflows/feedback.yml'
permissions:
  contents: read
jobs:
  selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome msedge
      - run: npx playwright test --config=playwright.feedback.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
