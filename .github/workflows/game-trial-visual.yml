name: Game trial visual and native audio gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome
      - name: Native output device (no autoplay policy bypass)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio sink_properties=device.description=CI_Audio
          pactl set-default-sink ci_audio
      - name: Actual channel identities and bounded game/art evidence
        run: npx playwright test tests/browser/browser-identity.spec.js tests/browser/garden-foot-stage.spec.js tests/browser/world-v7.spec.js tests/browser/garden-music.spec.js --retries=0 --max-failures=12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-visual-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome
      - name: Native output device
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio sink_properties=device.description=CI_Audio
          pactl set-default-sink ci_audio
      - run: npm run test:browser -- --max-failures=15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-regression-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
