name: Garden raptor encounters
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raptor-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome
      - run: npx playwright test --config=playwright.garden-raptors.config.js
        env:
          PUBLIC_URL: ${{ inputs.public_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garden-raptors-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garden-raptors-screenshots-${{ github.sha }}
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 14
