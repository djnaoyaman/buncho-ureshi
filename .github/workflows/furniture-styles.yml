name: Furniture styles
on:
  pull_request:
    paths:
      - 'src/field-visuals.js'
      - 'src/furniture-*.js'
      - 'scripts/build.mjs'
      - 'tests/furniture-*.test.js'
      - 'tests/browser/furniture-styles.spec.js'
      - 'playwright.furniture-styles.config.js'
      - '.github/workflows/furniture-styles.yml'
permissions:
  contents: read
jobs:
  styles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.furniture-styles.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: furniture-styles-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
