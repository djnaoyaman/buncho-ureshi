name: Clean home droppings
on:
  pull_request:
    paths:
      - 'src/engine.js'
      - 'src/game.js'
      - 'tests/clean-droppings.test.js'
      - 'tests/browser/care-gauges.spec.js'
      - '.github/workflows/clean-droppings.yml'
permissions:
  contents: read
jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome msedge
      - run: npx playwright test tests/browser/care-gauges.spec.js --project=${{ matrix.browser }} --grep='clean clears' --retries=0
