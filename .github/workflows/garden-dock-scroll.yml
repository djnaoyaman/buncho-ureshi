name: Garden dock scroll regression
on:
  pull_request:
    paths:
      - 'src/encounter-controller.js'
      - 'src/game.js'
      - 'tests/garden-dock-scroll.test.js'
      - 'tests/browser/garden-panel-persistence.spec.js'
      - '.github/workflows/garden-dock-scroll.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/garden-dock-scroll.test.js tests/encounter-ui.test.js
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome msedge
      - run: npx playwright test tests/browser/garden-panel-persistence.spec.js --project=chrome --project=edge --project=webkit --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garden-dock-scroll-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
