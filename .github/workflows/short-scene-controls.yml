name: Short scene controls
on:
  pull_request:
    paths:
      - 'src/game.css'
      - 'tests/browser/short-scene-controls.spec.js'
      - '.github/workflows/short-scene-controls.yml'
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome msedge
      - run: npx playwright test tests/browser/short-scene-controls.spec.js --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-controls-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
