name: Garden chrome readability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps webkit
      - run: google-chrome --version || npx playwright install chrome
      - run: npx playwright test --config=playwright.garden-chrome.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garden-chrome-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
