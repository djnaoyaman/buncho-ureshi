name: Care interaction audit
on:
  pull_request:
    paths:
      - 'src/game.js'
      - 'src/game.css'
      - 'src/game-chrome.js'
      - 'src/engine.js'
      - 'src/care-audio.js'
      - 'tests/browser/care.spec.js'
      - '.github/workflows/care-interactions.yml'
permissions:
  contents: read
jobs:
  care:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit chromium
      - run: npx playwright install chrome msedge
      - name: Provide native CI audio output device
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio sink_properties=device.description=CI_Audio
          pactl set-default-sink ci_audio
      - name: Verify current care controls, stages, rewards and sound
        run: npx playwright test tests/browser/care.spec.js --grep-invert 'care export' --project=${{ matrix.browser }} --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: care-${{ matrix.browser }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
