name: Verify and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome
      - name: Provide native CI audio output device
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio sink_properties=device.description=CI_Audio
          pactl set-default-sink ci_audio
          pactl info
      - name: Cage fixture placement and saved furnishings
        run: npx playwright test tests/browser/cage-placement.spec.js --project=chrome --project=webkit --retries=0 --output=cage-test-results
      - name: Trial startup, actions and save integrity (actual Chrome)
        run: npx playwright test tests/browser/trial-smoke.spec.js tests/browser/care-gauges.spec.js tests/browser/owner-peek.spec.js tests/browser/full-stage.spec.js tests/browser/garden-social.spec.js tests/browser/garden-protagonist.spec.js tests/browser/garden-interaction.spec.js tests/browser/garden-selector-scroll.spec.js tests/browser/compact-music-settings.spec.js tests/browser/game-music.spec.js --project=chrome --retries=0 --output=trial-test-results
      - name: Health notebook, independent clocks and saved hospital care
        run: npx playwright test tests/browser/health-notebook.spec.js tests/browser/life-care.spec.js --project=chrome --project=webkit --retries=0 --output=health-test-results
      - name: Settings switch notebook, keyboard focus and persistent music
        run: npx playwright test tests/browser/settings-switchbook.spec.js --project=chrome --project=webkit --retries=0 --output=settings-test-results
      - name: Approved menu icons, every destination and unchanged saves
        run: npx playwright test tests/browser/life-menu-icons.spec.js --project=chrome --project=webkit --retries=0 --output=menu-test-results
      - name: Roster face cards A, keyboard selection and unchanged saves
        run: npx playwright test tests/browser/roster-cards.spec.js --project=chrome --project=webkit --retries=0 --output=roster-test-results
      - name: Profile cards A, real identities, routes and unchanged saves
        run: npx playwright test tests/browser/profile-cards.spec.js --project=chrome --project=webkit --retries=0 --output=profile-test-results
      - name: Diary paper C, complete records, keyboard reading and unchanged saves
        run: npx playwright test tests/browser/diary-paper.spec.js --project=chrome --project=webkit --retries=0 --output=diary-test-results
      - name: New Ed founder, direct-line names and preserved existing saves
        run: npx playwright test tests/browser/direct-line-names.spec.js --project=chrome --project=webkit --retries=0 --output=naming-test-results
      - name: Nine memorial designs, fixed identity and preserved offerings
        run: npx playwright test tests/browser/memorial-designs.spec.js --project=chrome --project=webkit --retries=0 --output=memorial-test-results
      - name: Independent garden visits, legacy saves and notebook resume
        run: npx playwright test tests/browser/garden-visits.spec.js --project=chrome --project=webkit --retries=0
      - name: Hidden bird search hints, narrow screens and unchanged saves
        run: npx playwright test tests/browser/encounter-search-hints.spec.js --project=chrome --project=webkit --retries=0 --output=unseen-postcard-test-results
      - name: Family companion cards, atomic preferences and current outing
        run: npx playwright test tests/browser/companion-cards.spec.js --project=chrome --project=webkit --retries=0 --output=companion-test-results
      - name: Notebook card A, original photos and persistent friendship
        run: npx playwright test tests/browser/notebook-card.spec.js --project=chrome --project=webkit --retries=0 --output=notebook-card-test-results
      - name: Predator card A, original portraits and readable sources
        run: npx playwright test tests/browser/predator-catalog-layout.spec.js --project=chrome --project=webkit --retries=0 --output=predator-card-test-results
      - name: Family portrait cards, responsive zoom and unchanged saves
        run: npx playwright test --config=playwright.family-alignment.config.js --retries=0 --output=family-test-results
      - name: Relationship cards A, directed feelings and unchanged saves
        run: npx playwright test tests/browser/relationship-cards.spec.js --project=chrome --project=webkit --retries=0 --output=relationship-test-results
      - name: Garden bookmark C, selection rows and scene visibility
        run: npx playwright test tests/browser/garden-bookmarks.spec.js --project=chrome --project=webkit --retries=0 --output=garden-bookmark-test-results
      - name: Decoration guarantee, completion and save migration
        run: npx playwright test tests/browser/decor-guarantee.spec.js --project=chrome --project=webkit --retries=0
      - name: Child-friendly game help, ruby and disclosure panels
        run: npx playwright test tests/browser/game-help.spec.js --project=chrome --project=webkit --retries=0
      - name: Game and site Home Screen targets, navigation and history
        run: npx playwright test tests/browser/game-install.spec.js --project=chrome --project=webkit --retries=0 --output=game-install-test-results
      - name: Game share cards before and after JavaScript
        run: npx playwright test tests/browser/game-sharing.spec.js --project=chrome --project=webkit --retries=0
      - name: Encyclopedia photographs and reduced-motion scroll
        run: npx playwright test --config=playwright.editorial.config.js --output=editorial-test-results
      - name: Site search on mobile WebKit and Chrome
        run: npx playwright test --config=playwright.site-search.config.js --project=search-iphone --project=search-android --project=search-chrome --project=search-safari --output=search-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            companion-test-results/
            cage-test-results/
            trial-test-results/
            health-test-results/
            memorial-test-results/
            naming-test-results/
            roster-test-results/
            profile-test-results/
            diary-test-results/
            settings-test-results/
            menu-test-results/
            editorial-test-results/
            search-test-results/
            notebook-card-test-results/
            unseen-postcard-test-results/
            garden-bookmark-test-results/
            predator-card-test-results/
            relationship-test-results/
            family-test-results/
            game-install-test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-a-screenshots-${{ github.sha }}
          path: health-test-results/**/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-a-screenshots-${{ github.sha }}
          path: settings-test-results/**/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-menu-screenshots-${{ github.sha }}
          path: menu-test-results/**/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memorial-nine-screenshots-${{ github.sha }}
          path: memorial-test-results/**/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-line-naming-screenshots-${{ github.sha }}
          path: naming-test-results/**/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster-card-screenshots-${{ github.sha }}
          path: roster-test-results/**/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-card-screenshots-${{ github.sha }}
          path: profile-test-results/**/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diary-paper-screenshots-${{ github.sha }}
          path: diary-test-results/**/*.png
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
