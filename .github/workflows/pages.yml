name: UI-only QA — no deployment
on:
  push:
    branches: [qa/game-ui-only-20261102]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Provide native CI audio output device
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio sink_properties=device.description=CI_Audio
          pactl set-default-sink ci_audio
          pactl info
      - name: Native care audio (not mocked)
        run: npx playwright test tests/browser/care.spec.js --project=firefox --grep "care sound opt-in" --retries=0
      - name: Diagnostic UI-only browser verification (max 12 failures; original BGM unverified)
        run: npx playwright test --max-failures=12
        env:
          REFERENCE_QA: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-only-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload bounded visual evidence separately from traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-visual-evidence-${{ github.sha }}
          path: |
            playwright-report/data/*.png
            playwright-report/data/*.jpg
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 14
