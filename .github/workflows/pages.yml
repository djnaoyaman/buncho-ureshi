name: UI-only QA — no deployment
on:
  push:
    branches: [qa/game-ui-only-20261102]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Native care audio (not mocked)
        run: npx playwright test tests/browser/care.spec.js --project=firefox --grep "care sound opt-in" --retries=0
      - name: UI-only browser verification (original BGM explicitly unverified)
        run: npx playwright test
        env:
          REFERENCE_QA: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-only-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
