name: Owner customization focused browser
on:
  pull_request:
    paths: ['src/owner-profile.*', 'tests/browser/owner-customization.spec.js', '.github/workflows/owner-customization.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chrome webkit
      - run: npx playwright test tests/browser/owner-customization.spec.js --project=chrome --project=webkit --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-customization-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
