name: Status feedback controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit chromium
      - run: npx playwright install chrome
      - name: Verify success and error feedback does not intercept navigation
        run: npx playwright test tests/browser/message-controls.spec.js --project=${{ matrix.browser }} --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-${{ matrix.browser }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
