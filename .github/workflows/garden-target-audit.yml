name: Garden target audit
on:
  pull_request:
    paths:
      - 'src/encounter-ui.*'
      - 'src/data/gardens.js'
      - 'src/garden*'
      - 'tests/browser/garden-hit-targets.spec.js'
      - '.github/workflows/garden-target-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome msedge
      - run: npx playwright test tests/browser/garden-hit-targets.spec.js --project=${{ matrix.browser }} --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garden-target-${{ matrix.browser }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
