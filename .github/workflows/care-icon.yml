name: Care button icon
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  care-icon:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome
      - run: npx playwright test --config=playwright.care-icon.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: care-icon-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

