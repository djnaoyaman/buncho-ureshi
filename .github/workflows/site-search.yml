name: Site search accessibility
on:
  pull_request:
    paths:
      - 'src/app.js'
      - 'src/style.css'
      - 'scripts/build.mjs'
      - 'tests/browser/site-search.spec.js'
      - 'playwright.site-search.config.js'
      - '.github/workflows/site-search.yml'
  push:
    branches: [main]
    paths:
      - 'src/app.js'
      - 'src/style.css'
      - 'scripts/build.mjs'
      - 'tests/browser/site-search.spec.js'
      - 'playwright.site-search.config.js'
      - '.github/workflows/site-search.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome msedge
      - run: npx playwright test --config=playwright.site-search.config.js --project=search-iphone --grep "search is visible on opening at 390x664"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-search-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
