name: Site search accessibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright install chrome
      - run: npx playwright test --config=playwright.site-search.config.js
        env:
          PUBLIC_URL: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-search-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
